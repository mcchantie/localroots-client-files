name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: client_files_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLIENT_FILES_MIGRATION_TEST_URL: jdbc:postgresql://localhost:5432/client_files_migration_test
      CLIENT_FILES_MIGRATION_TEST_USER: postgres
      CLIENT_FILES_MIGRATION_TEST_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build backend
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Test attachment behavior
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=AuthServiceTest,AttachmentRenameTest,AttachmentControllerTest,AttachmentPermanentDeleteTest,EstimatorIntegrationSecurityTest,CrmFileReferenceControllerTest,ClientFilesFlywayStartupTest,ClientFilesPostgresMigrationTest test

