client-files:
  auth:
    jwt-secret-base64: ${CLIENT_FILES_JWT_SECRET_BASE64}
    jwt-issuer: ${CLIENT_FILES_JWT_ISSUER:client-files-api}
    access-token-ttl: ${CLIENT_FILES_ACCESS_TOKEN_TTL:8h}
    tenant-id: ${CLIENT_FILES_TENANT_ID}
  cors:
    allowed-origins: ${CLIENT_FILES_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${CLIENT_FILES_ALLOWED_ORIGIN_PATTERNS:}
  security:
    allow-tenant-header: ${CLIENT_FILES_ALLOW_TENANT_HEADER:false}
    allow-unverified-contact-ids: ${CLIENT_FILES_ALLOW_UNVERIFIED_CONTACT_IDS:false}
    allow-unverified-estimate-ids: ${CLIENT_FILES_ALLOW_UNVERIFIED_ESTIMATE_IDS:false}

logging:
  file:
    name: logs/localroots-clientfiles.log

server:
  port: ${PORT:8083}
  shutdown: graceful

spring:
  application:
    name: client-files
  config:
    import: optional:classpath:application-logging.yaml
  datasource:
    url: ${CRM_DB_URL}
    username: ${CRM_DB_USER}
    password: ${CRM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    embedded-database-connection: none
  flyway:
    enabled: ${CLIENT_FILES_FLYWAY_ENABLED:true}
    # Independent history: CRM uses public.flyway_schema_history in the same DB.
    table: client_files_flyway_schema_history
    default-schema: public
    locations: classpath:db/client-files-migration
    baseline-on-migrate: true
    baseline-version: 99
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  web:
    error:
      include-message: never

storage:
  s3:
    bucket: ${CLIENT_FILES_S3_BUCKET}
    region: ${CLIENT_FILES_S3_REGION}
    endpoint: ${CLIENT_FILES_S3_ENDPOINT:}
    access-key-id: ${CLIENT_FILES_S3_ACCESS_KEY_ID:}
    secret-access-key: ${CLIENT_FILES_S3_SECRET_ACCESS_KEY:}
    path-style-access: ${CLIENT_FILES_S3_PATH_STYLE_ACCESS:true}
    upload-url-ttl: ${CLIENT_FILES_UPLOAD_URL_TTL:15m}
    download-url-ttl: ${CLIENT_FILES_DOWNLOAD_URL_TTL:5m}
    max-file-size: ${CLIENT_FILES_MAX_FILE_SIZE:500MB}
    max-text-file-size: ${CLIENT_FILES_MAX_TEXT_FILE_SIZE:5MB}
    allowed-content-types: image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf,text/plain,video/mp4,video/quicktime

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers
  endpoint:
    health:
      show-details: never

